<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Champicoin</title>
  <meta name="theme-color" content="#4a6741">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Écran de connexion à un groupe -->
  <div id="ecran-groupe" class="ecran">
    <div class="carte-login">
      <h1>🍄 Champicoin</h1>
      <p class="sous-titre">Tes coins à champignons, en toute discrétion.</p>

      <div class="onglets">
        <button class="onglet actif" data-onglet="rejoindre">Rejoindre un groupe</button>
        <button class="onglet" data-onglet="creer">Créer un groupe</button>
      </div>

      <form id="form-rejoindre" class="form-onglet">
        <label for="pseudo-rejoindre">Ton prénom / pseudo</label>
        <input type="text" id="pseudo-rejoindre" placeholder="Ex : Florian" required autocomplete="off">
        <label for="code-groupe">Code d'accès</label>
        <input type="text" id="code-groupe" placeholder="Ex : CEPE-4821" required autocomplete="off">
        <button type="submit">Rejoindre</button>
        <p class="erreur" id="erreur-rejoindre"></p>
      </form>

      <form id="form-creer" class="form-onglet cache">
        <label for="pseudo-creer">Ton prénom / pseudo</label>
        <input type="text" id="pseudo-creer" placeholder="Ex : Florian" required autocomplete="off">
        <label for="nom-groupe">Nom du groupe</label>
        <input type="text" id="nom-groupe" placeholder="Ex : Famille Dupont" required autocomplete="off">
        <button type="submit">Créer le groupe</button>
        <p class="erreur" id="erreur-creer"></p>
      </form>
    </div>
  </div>

  <!-- Écran principal : la carte -->
  <div id="ecran-carte" class="ecran cache">
    <header class="entete">
      <div>
        <strong id="nom-groupe-actif"></strong>
        <button id="btn-renommer-groupe" class="btn-lien" title="Renommer le groupe">✏️</button>
        <a id="lien-contact" class="btn-lien" href="mailto:fouillon@free.fr?subject=Champicoin%20-%20" title="Contacter le développeur">✉️</a>
        <span id="statut-connexion" class="statut">en ligne</span>
        <div class="code-groupe">Code : <span id="code-groupe-actif"></span></div>
      </div>
      <div class="entete-actions">
        <button id="btn-liste" class="btn-icone" title="Liste des points">☰</button>
        <button id="btn-filtre" class="btn-icone" title="Filtrer">▽</button>
        <button id="btn-quitter-groupe" class="btn-icone" title="Changer de groupe">⇄</button>
      </div>
    </header>

    <div id="barre-filtre" class="barre-filtre cache">
      <input type="text" id="recherche-filtre" placeholder="Rechercher un type...">
      <div id="puces-filtre" class="puces-filtre"></div>
    </div>

    <div id="carte"></div>

    <!-- Panneau flottant : liste triable des points -->
    <div id="panneau-liste" class="panneau-liste cache">
      <div class="panneau-liste-entete">
        <div class="panneau-liste-ligne-titre">
          <strong>Points affichés</strong>
          <button id="btn-fermer-liste" class="btn-fermer-panneau" title="Fermer">✕</button>
        </div>
        <select id="tri-liste">
          <option value="proximite">Du plus proche</option>
          <option value="recent">Du plus récent</option>
          <option value="ancien">Du plus ancien</option>
          <option value="alpha">Alphabétique</option>
        </select>
      </div>
      <div id="contenu-liste" class="panneau-liste-contenu"></div>
    </div>

    <!-- Boutons d'action flottants -->
    <div class="pile-boutons-flottants">
      <button id="btn-telecharger-carte" class="btn-flottant-secondaire" title="Télécharger la carte pour un usage hors-ligne">⬇️</button>
      <button id="btn-importer-gpx" class="btn-flottant-secondaire" title="Importer un fichier GPX">
        <img src="icons/gpx-icon.png" class="icone-bouton" alt="Importer GPX">
      </button>
      <button id="btn-placement-manuel" class="btn-flottant-secondaire" title="Placer un point manuellement sur la carte">✛</button>
      <button id="btn-localiser" class="btn-flottant" title="Me localiser et ajouter un point">
        <span class="icone-champi-plus">🍄<span class="badge-plus">+</span></span>
      </button>
    </div>
    <input type="file" id="fichier-gpx" accept=".gpx" class="cache">

    <div id="bandeau-placement-manuel" class="bandeau-info cache">Touche la carte à l'endroit du coin à enregistrer</div>

    <div id="compteur-attente" class="badge-attente cache">
      <span id="texte-compteur-attente"></span>
      <button id="btn-forcer-synchro" class="btn-mini-synchro">🔄 Synchroniser</button>
    </div>
  </div>

  <!-- Formulaire d'ajout de champignon -->
  <div id="modal-ajout" class="modal cache">
    <div class="modal-contenu">
      <h2 id="titre-modal-ajout">Nouveau coin 🍄</h2>
      <form id="form-champignon">
        <input type="hidden" id="id-champignon-edite">
        <input type="hidden" id="icone-champignon" value="autre">

        <label for="type-champignon">Type de champignon</label>
        <div class="ligne-type-icone">
          <img id="apercu-icone-type" src="icons/champignons/autre.png" class="apercu-icone">
          <select id="type-champignon" required>
            <option value="" disabled selected>Choisis un type</option>
            <option>Cèpe</option>
            <option>Chanterelle (Girolle)</option>
            <option>Trompette chanterelle</option>
            <option>Trompette de mort</option>
            <option>Pied de mouton</option>
            <option>Morille</option>
            <option>Rosé des prés</option>
            <option>Pleurote</option>
            <option>Bolet</option>
            <option>Mousseron</option>
            <option>Lactaire Améthyste</option>
            <option value="autre">Autres</option>
          </select>
        </div>
        <input type="text" id="type-champignon-autre" class="cache" placeholder="Précise le type de champignon">

        <label for="date-trouvee">Date</label>
        <input type="date" id="date-trouvee" required>

        <label for="notes-champignon">Notes (optionnel)</label>
        <textarea id="notes-champignon" placeholder="Sous les chênes, versant nord..."></textarea>

        <p id="coordonnees-ajout" class="coordonnees-info"></p>

        <div class="modal-actions">
          <button type="button" id="btn-annuler-ajout" class="btn-secondaire">Annuler</button>
          <button type="submit" class="btn-principal">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Détail d'un point existant -->
  <div id="modal-detail" class="modal cache">
    <div class="modal-contenu">
      <h2 id="detail-type"></h2>
      <p id="detail-date" class="detail-date"></p>
      <p id="detail-notes"></p>
      <p id="detail-coordonnees" class="coordonnees-info"></p>
      <div id="detail-historique" class="historique-info"></div>
      <div class="modal-actions">
        <button type="button" id="btn-supprimer-point" class="btn-danger">Supprimer</button>
        <button type="button" id="btn-modifier-point" class="btn-secondaire">Modifier</button>
        <button type="button" id="btn-fermer-detail" class="btn-principal">Fermer</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
